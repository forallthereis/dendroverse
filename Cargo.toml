[package]
name = "dendroverse"
version = "0.3.0"
edition = "2024"
description = "Solve computational problems on graphs using dynamic programming over tree decompositions."
license = "MIT"
repository = "https://github.com/forallthereis/dendroverse"

[features]
# Tree decomposition engines
engine-arboretum = ["dep:arboretum-td"]
engine-goatd = ["dep:goatd"]
# Graph library integrations
integrate-petgraph = ["dep:petgraph"]

[dev-dependencies]
petgraph = "0.8.3"

[dependencies]
anyhow = "1.0.104"
arboretum-td = { version = "0.1", optional = true }
fxhash = "0.2.1"
goatd = { version = "0.2", optional = true }
itertools = "0.15.0"
petgraph = { version = "0", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
